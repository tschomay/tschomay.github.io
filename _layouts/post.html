---
layout: default
---
<div class="wrap">
  <header class="post-hd">
    <p class="post-meta">
      <span>{{ page.date | date: "%b %-d, %Y" }}</span>
      {% if page.topic %}<span class="tag">{{ page.topic }}</span>{% endif %}
      {% if page.author %}<span>&middot; {{ page.author }}</span>{% endif %}
      {% if page.meta %}<span>&middot; {{ page.meta }}</span>{% endif %}
    </p>
    <h1>{{ page.title }}</h1>
  </header>

  <article class="post-content">
    {{ content }}
  </article>
</div>
