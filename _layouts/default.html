<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="duotone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.086 0.851"/>
        <feFuncG type="table" tableValues="0.129 0.573"/>
        <feFuncB type="table" tableValues="0.114 0.255"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <div class="site-nav">
    <a href="{{ '/' | relative_url }}" class="word">TED SCHOMAY</a>
    <nav class="links" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>Home</a>
      <a href="{{ '/about' | relative_url }}"{% if page.url == '/about' or page.url == '/about/' or page.url == '/research' or page.url == '/research/' %} class="on"{% endif %}>About</a>
      <a href="{{ '/blog' | relative_url }}"{% if page.url == '/blog' or page.url == '/blog/' or page.layout == 'post' %} class="on"{% endif %}>Notes</a>
      <a href="https://www.linkedin.com/in/tschomay" class="li" target="_blank" rel="noopener">LinkedIn ↗</a>
    </nav>
  </div>

  <main id="main">
    {{ content }}
  </main>

  <div class="site-footer">
    <span>&copy; {{ site.time | date: "%Y" }} Ted Schomay</span>
    <span>Built with Jekyll</span>
  </div>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
